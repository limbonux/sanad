  <div class="emg-brand">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.4 8 11 4.6-2.6 8-6 8-11V5l-8-3Z"/><path d="M12 8v5"/><path d="M9.5 10.5h5"/></svg>
    <span>سَند</span>
  </div>

  <div class="warn-circle">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.3 3.9 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 17h.01"/></svg>
  </div>

  <div>
    <div class="emg-title" data-i18n="emg.title">تنبيه طوارئ طبي</div>

  </div>

  <div class="ring-wrap">
    <svg width="150" height="150" viewBox="0 0 150 150">
      <circle cx="75" cy="75" r="66" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="10"/>
      <circle id="ring" cx="75" cy="75" r="66" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="414.7" stroke-dashoffset="0" transform="rotate(-90 75 75)"/>
    </svg>
    <div class="ring-count">
      <span class="num" id="count">5</span>

    </div>
  </div>

  <div class="emg-hint" data-i18n="emg.hint">يمكنك إلغاء الإنذار إذا كان إنذارًا كاذبًا</div>

  <div class="sent-pill" id="sentPill" style="display:none;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12.5 2.5 2.5L16 9.5"/></svg>
    <span style="font-size:13.5px;font-weight:700;" data-i18n="emg.sent">تم إرسال تنبيه الطوارئ لولي الأمر</span>
  </div>

  <div class="emg-actions">
    <a href="index.html" class="btn-white" data-i18n="emg.cancel">تم إلغاء الإنذار - أنا بخير</a>
    <a href="details.html" id="viewMsgLink" class="btn-outline-white" style="display:none;" data-i18n="emg.view_msg">عرض رسالة الاستغاثة المرسلة</a>
  </div>

</div>
</div>

<script>
  /* نغمة إنذار خفيفة-متوسطة: نغمتان ليّنتان بدل صوت تنبيه حاد يخيف المستخدم */
  (function(){
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    var ctx;
    function getCtx(){
      if(!ctx) ctx = new Ctx();
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    /* استئناف السياق الصوتي عند أول تفاعل، لتفادي حجب المتصفح للتشغيل التلقائي */
    ['pointerdown','keydown','touchstart'].forEach(function(ev){
      document.addEventListener(ev, function(){ getCtx(); }, {once:true, passive:true});
    });

    function tone(freq, start, dur, peak){
      var c = getCtx();
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var t0 = c.currentTime + start;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(peak, t0 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain).connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }
    /* تكة عد تنازلي: نغمة قصيرة وهادئة */
    window.__sanadTick = function(){ tone(880, 0, 0.14, 0.11); };
    /* نغمة إرسال الإنذار: نغمتان صاعدتان تدلان على انتهاء العد */
    window.__sanadSent = function(){ tone(660, 0, 0.16, 0.13); tone(880, 0.15, 0.22, 0.13); };
  })();
</script>
<script>
  (function(){
    var total = 5;
    var count = total;
    var circumference = 414.7;
    var countEl = document.getElementById('count');
    var ringEl = document.getElementById('ring');
    var sentPill = document.getElementById('sentPill');
    var viewMsgLink = document.getElementById('viewMsgLink');

    if(window.__sanadTick) window.__sanadTick();

    var timer = setInterval(function(){
      count = Math.max(0, count - 1);
      countEl.textContent = count;
      ringEl.setAttribute('stroke-dashoffset', circumference * (count / total));
      if (count === 0){
        clearInterval(timer);
        sentPill.style.display = 'flex';
        viewMsgLink.style.display = 'block';
        if(window.__sanadSent) window.__sanadSent();

        /* تسجيل التنبيه في قاعدة البيانات إن كان السيرفر المحلي شغّالًا */
        if(window.SanadAPI){
          window.SanadAPI.postAlert({
            kind: 'seizure',
            status: 'sent',
            heart_rate: 118,
            location_label: 'الرياض'
          }).catch(function(){ /* السيرفر المحلي غير متاح - لا شيء يحدث */ });
        }

        /* إشعار حقيقي على الجهاز (أو رسالة داخل الصفحة إن لم يُسمح) */
        if(window.SanadNotify){
          window.SanadNotify.fire(
            'تنبيه طوارئ طبي - سَند',
            'تم رصد اشتباه نوبة تشنّج وإرسال التنبيه لولي الأمر مع الموقع الجغرافي الحي.',
            { requireInteraction: true, tag: 'sanad-emergency' }
          );
        }
      } else {
        if(window.__sanadTick) window.__sanadTick();
      }
    }, 1000);
  })();
</script>

</body>
